<script>
const $=s=>document.querySelector(s),view=$('#view');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEX={Black:'#111827',White:'#f3f4f6',Grey:'#9ca3af',Gray:'#9ca3af',Navy:'#1e3a8a',Silver:'#cbd5e1',Blue:'#2563eb',Red:'#dc2626',Green:'#16a34a',Pink:'#ec4899',Any:'conic-gradient(#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7,#ef4444)',Multi:'conic-gradient(#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7,#ef4444)'};
const S={need:'',qs:[],i:0,ans:{},botMsg:''};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let UID=lsGet('pa_uid');if(!UID){UID=(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());lsSet('pa_uid',UID)}
let LIMIT=+lsGet('pa_limit')||0,SPENT=0,ORDERS=[];
const money=n=>'$'+(+n).toFixed(2);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3200)}
function modal(html){const m=$('#modal');m.innerHTML='<div class="mb"><div class="mc"><button class="mx" id="mx" aria-label="Close">×</button>'+html+'</div></div>';$('#mx').onclick=closeModal;m.firstChild.onclick=e=>{if(e.target===m.firstChild)closeModal()}}
function closeModal(){$('#modal').innerHTML=''}
let ME=null;
function paintAcct(){$('#acct').textContent=ME?'👤 '+ME.name.split(' ')[0]:'Sign in'}
async function getMe(){try{const r=await fetch('/api/me');const j=await r.json();ME=j.user||null}catch(e){ME=null}
 if(ME){LIMIT=+ME.budget||0;lsSet('pa_limit',String(LIMIT))}paintAcct();paintWallet()}
function authDone(j,after){ME=j.user;LIMIT=+ME.budget||LIMIT;paintAcct();closeModal();loadOrders();toast('Welcome, '+ME.name.split(' ')[0]+' 👋');if(after)after()}
function openAuth(msg,after){let mode='in';
 const draw=()=>{modal(`<h2>${mode==='in'?'Welcome back':'Create your account'}</h2><p class="hint">${esc(msg||'Save your details and check out faster.')}</p>
 <div class="seg"><button data-m="in" class="${mode==='in'?'on':''}">Sign in</button><button data-m="up" class="${mode==='up'?'on':''}">Create account</button></div>
 <form id="af" class="frm">${mode==='up'?'<input name="name" placeholder="Full name" required autocomplete="name"><input name="phone" placeholder="Phone, e.g. +1 555 123 4567" required autocomplete="tel">':''}
 <input name="email" type="email" placeholder="Email" required autocomplete="email"><input name="password" type="password" placeholder="Password (8+ characters)" required minlength="8" autocomplete="${mode==='in'?'current-password':'new-password'}">
 ${mode==='up'?'<div class="sep">Shipping address</div><input name="line1" placeholder="Street address" required autocomplete="address-line1"><div class="two"><input name="city" placeholder="City" required><input name="state" placeholder="State / region"></div><div class="two"><input name="postal" placeholder="Postal code" required><input name="country" placeholder="Country" required></div><p class="fine">Demo project: please use fake details. Payments are PayPal Sandbox only.</p>':''}
 <div id="ae" class="err" style="display:none;margin:0"></div><button class="btn" style="width:100%">${mode==='in'?'Sign in':'Create account'}</button></form>
 <div class="sep">or</div><button class="ghost" id="dm" style="width:100%">⚡ Try instantly with a demo account</button>`);
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
  $('#af').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
   const body=mode==='in'?{email:f.email,password:f.password}:{name:f.name,phone:f.phone,email:f.email,password:f.password,address:{line1:f.line1,city:f.city,state:f.state,postal:f.postal,country:f.country}};
   try{authDone(await api(mode==='in'?'/api/auth/login':'/api/auth/register',body),after)}catch(er){const x=$('#ae');x.style.display='block';x.textContent=er.message}};
  $('#dm').onclick=async()=>{try{authDone(await api('/api/auth/demo',{}),after)}catch(er){const x=$('#ae');x.style.display='block';x.textContent=er.message}}};
 draw()}
function showAccount(){setTab('');if(!ME){openAuth('',showAccount);return}const a=ME.address||{};
 view.innerHTML=`<div class="wiz"><h2>Your account</h2><p class="hint">${esc(ME.email)}${ME.isDemo?' · demo account':''}</p>
 <form id="pf" class="frm"><input name="name" value="${esc(ME.name)}" placeholder="Full name" required><input name="phone" value="${esc(ME.phone)}" placeholder="Phone" required>
 <div class="sep">Shipping address</div><input name="line1" value="${esc(a.line1||'')}" placeholder="Street address" required><div class="two"><input name="city" value="${esc(a.city||'')}" placeholder="City" required><input name="state" value="${esc(a.state||'')}" placeholder="State / region"></div><div class="two"><input name="postal" value="${esc(a.postal||'')}" placeholder="Postal code" required><input name="country" value="${esc(a.country||'')}" placeholder="Country" required></div>
 <div id="pe" class="err" style="display:none;margin:0"></div><button class="btn">Save changes</button></form>

 $('#pf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const j=await api('/api/profile',{name:f.name,phone:f.phone,address:{line1:f.line1,city:f.city,state:f.state,postal:f.postal,country:f.country}});ME=j.user;paintAcct();toast('Account saved ✓')}catch(er){const x=$('#pe');x.style.display='block';x.textContent=er.message}};
 $('#lo').onclick=async()=>{try{await api('/api/auth/logout',{})}catch(e){}ME=null;ORDERS=[];LIMIT=0;lsSet('pa_limit','0');paintAcct();paintWallet();toast('Signed out');intro()};$('#bk').onclick=intro}
function setTab(t){$('#tShop').classList.toggle('on',t==='shop');$('#tOrd').classList.toggle('on',t==='orders')}
function remaining(){return LIMIT?Math.max(0,+(LIMIT-SPENT).toFixed(2)):null}
function paintWallet(){$('#oc').textContent=ORDERS.length;$('#walTxt').textContent=LIMIT?money(remaining())+' left of '+money(LIMIT):'Set budget'}
async function loadOrders(){try{const r=await fetch('/api/orders');const j=await r.json();ORDERS=j.orders||[]}catch(e){ORDERS=[]}
 SPENT=ORDERS.filter(o=>o.status==='COMPLETED').reduce((s,o)=>s+o.total,0);paintWallet()}
$('#wal').onclick=()=>{const v=prompt('Set your monthly spending limit in USD. The AI agent can never exceed it. Enter 0 to remove.',LIMIT||'100');if(v===null)return;LIMIT=Math.max(0,parseFloat(v)||0);lsSet('pa_limit',String(LIMIT));if(ME)api('/api/profile',{budget:LIMIT}).catch(()=>{});paintWallet();toast(LIMIT?'Budget guardian set to '+money(LIMIT):'Budget limit removed')};
function chipFor(s){return s==='COMPLETED'?'<span class="sc paid">Paid</span>':s==='REFUNDED'?'<span class="sc ref">Refunded</span>':'<span class="sc pen">'+esc(s==='CREATED'||s==='PAYER_ACTION_REQUIRED'?'Pending':s)+'</span>'}
async function showOrders(){setTab('orders');if(!ME){view.innerHTML='<div class="wiz load"><h2>Sign in to see your orders</h2><p class="hint">Your orders, shipping details and refunds live in your account.</p><button class="btn" id="si">Sign in or create account</button></div>';$('#si').onclick=()=>openAuth('',showOrders);return}
 view.innerHTML='<div class="res-h"><div><h2>Your orders</h2><p style="color:var(--mut);margin:6px 0 0">Every purchase made through PayAgent, with PayPal status and one-click refunds.</p></div><button class="ghost" id="rl">↻ Refresh</button></div><div class="stats" id="stats"></div><div id="gw"></div>';
 $('#rl').onclick=showOrders;await loadOrders();
 const paid=ORDERS.filter(o=>o.status==='COMPLETED'),ref=ORDERS.filter(o=>o.status==='REFUNDED');
 $('#stats').innerHTML=`<div class="stat"><span>Orders</span><b>${ORDERS.length}</b></div><div class="stat"><span>Total spent</span><b>${money(SPENT)}</b></div><div class="stat"><span>Refunded</span><b>${money(ref.reduce((s,o)=>s+o.total,0))}</b></div><div class="stat"><span>Budget left</span><b>${LIMIT?money(remaining()):'No limit'}</b></div>`;
 if(!ORDERS.length){$('#gw').innerHTML='<div class="gw empty"><h3>No orders yet</h3><p>Find something you like and your orders will show up here.</p><button class="btn" id="go">Start shopping</button></div>';$('#go').onclick=intro;return}
 const rows=ORDERS.map(o=>({...o,itemsTxt:(o.items||[]).map(i=>i.qty+'× '+i.name).join(', '),dateTxt:new Date(o.createdAt).toLocaleString()}));
 if(window.agGrid&&agGrid.createGrid){
  $('#gw').innerHTML='<div class="gw"><div id="grid" class="ag-theme-quartz" style="width:100%"></div></div>';
  agGrid.createGrid($('#grid'),{rowData:rows,domLayout:'autoHeight',pagination:rows.length>8,paginationPageSize:8,defaultColDef:{sortable:true,filter:true,resizable:true},
   columnDefs:[{headerName:'Date',field:'createdAt',valueGetter:p=>p.data.dateTxt,comparator:(a,b,x,y)=>x.data.createdAt-y.data.createdAt,sort:'desc',minWidth:170},
    {headerName:'Items',field:'itemsTxt',flex:2,minWidth:220,tooltipField:'itemsTxt'},
    {headerName:'Order ID',field:'id',minWidth:170},
    {headerName:'Total',field:'total',valueFormatter:p=>money(p.value),type:'numericColumn',maxWidth:120},
    {headerName:'Status',field:'status',cellRenderer:p=>{const d=document.createElement('span');d.innerHTML=chipFor(p.value);return d},maxWidth:130},
    {headerName:'Actions',colId:'act',sortable:false,filter:false,minWidth:190,cellRenderer:p=>{const d=document.createElement('div');
      const c=document.createElement('button');c.className='ab';c.textContent='Check';c.onclick=()=>orderAct('status',p.data.id);d.appendChild(c);
      if(p.data.status==='COMPLETED'){const r=document.createElement('button');r.className='ab rf';r.textContent='Refund';r.onclick=()=>orderAct('refund',p.data.id);d.appendChild(r)}return d}}]});
 }else{
  $('#gw').innerHTML='<div class="gw" style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="text-align:left;color:var(--mut)"><th>Date</th><th>Items</th><th>Order</th><th>Total</th><th>Status</th></tr>'+rows.map(o=>`<tr style="border-top:1px solid var(--line)"><td style="padding:10px 6px">${esc(o.dateTxt)}</td><td>${esc(o.itemsTxt)}</td><td>${esc(o.id)}</td><td>${money(o.total)}</td><td>${chipFor(o.status)}</td></tr>`).join('')+'</table></div>'}}
async function orderAct(kind,id){try{if(kind==='refund'&&!confirm('Refund this order via PayPal?'))return;const j=await api(kind==='refund'?'/api/refund':'/api/status',{order_id:id});
 toast(j.error?'⚠️ '+j.error:kind==='refund'?'↩️ Refund '+j.status:'Status: '+(j.display_status||j.status));showOrders()}catch(e){toast('⚠️ '+e.message)}}
async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const j=await r.json();if(j.error&&r.status>=400){const e=new Error(j.error);e.status=r.status;throw e}return j}
function intro(){setTab('shop');S.need='';S.qs=[];S.i=0;S.ans={};
 view.innerHTML=`<section class="hero"><span class="tag">✨ AI shopping agent · powered by PayPal</span>
 <h1>Tell us what you need. <span>We’ll find the best one.</span></h1>
 <p>Answer a few quick questions and PayAgent searches online stores, picks the best matches for you, and lets you pay securely with PayPal.</p>
 <form class="search" id="nf"><input id="need" placeholder="What do you want to buy? e.g. a black pen, running shoes, a gift for a coder" autocomplete="off" autofocus><button class="btn">Find my best match →</button></form>
 ${S.botMsg?`<div class="bot"><i>✦</i><div>${esc(S.botMsg)}</div></div>`:''}
 <div class="chips">${['🖊️ A good pen','🎧 Wireless headphones','👟 Running shoes','🎒 Laptop backpack','🎁 Gift for a coder'].map(t=>`<button type="button" class="chip" data-t="${t.slice(3)}">${t}</button>`).join('')}</div>
 <div class="steps"><div class="step"><b>1</b><h4>Tell us what you want</h4><span>Type it in your own words, no filters or menus.</span></div>
 <div class="step"><b>2</b><h4>Answer quick questions</h4><span>Budget, colour and what matters most, as simple choices.</span></div>
 <div class="step"><b>3</b><h4>Pay with PayPal</h4><span>Get the top 3 live matches and check out in one click.</span></div></div></section>`;
 $('#nf').onsubmit=e=>{e.preventDefault();const v=$('#need').value.trim();if(v)begin(v)};
 view.querySelectorAll('.chip').forEach(b=>b.onclick=()=>begin(b.dataset.t))}
function loading(t,sub){view.innerHTML=`<div class="wiz load"><div class="spin"></div><h2>${t}</h2><p class="hint">${sub||'PayAgent is working on it…'}</p></div>`}
async function begin(need){S.need=need;S.botMsg='';loading('Getting your questions ready…');
 try{const j=await api('/api/questions',{need});
  if(j.chat){S.botMsg=j.reply;intro();return}
  S.qs=j.questions;S.i=0;S.ans={};$('#mode').textContent=(j.ai?'AI · '+(j.providers||[]).join(' + '):'Demo mode')+' · PayPal Sandbox';ask()}catch(e){fail(e)}}
function ask(){const q=S.qs[S.i],isC=q.id==='colour',n=S.qs.length;
 view.innerHTML=`<div class="wiz"><div class="top"><span>Step ${S.i+1} of ${n}</span><span class="need">🔎 ${esc(S.need)}</span></div>
 <div class="prog"><i style="width:${((S.i+1)/n)*100}%"></i></div><h2>${esc(q.q)}</h2><p class="hint">Pick one option. This helps us choose better for you.</p>
 <div class="opts">${q.options.map((o,k)=>`<button class="opt" data-o="${esc(o)}">${isC?`<span class="sw" style="background:${HEX[o]||'#d1d5db'}"></span>`:`<span class="k">${'ABCDEFGH'[k]}</span>`}<span>${esc(o)}</span></button>`).join('')}</div>
 <div class="nav2">${S.i?'<button class="ghost" id="back">← Back</button>':'<button class="ghost" id="back">← Change request</button>'}<span></span></div></div>`;
 view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.ans[q.id]=b.dataset.o;S.i++;S.i<n?ask():results()});
 $('#back').onclick=()=>{if(S.i){S.i--;ask()}else intro()};window.scrollTo({top:0,behavior:'smooth'})}
async function results(){
 view.innerHTML=`<div class="res-h"><div><h2>Finding your best matches…</h2><p class="hint" style="color:var(--mut)">Searching online stores and ranking with AI</p></div></div><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`;
 try{const j=await api('/api/recommend',{need:S.need,answers:S.ans});S.budget=j.budget_max;const labels=['🏆 Best match','⭐ Great value','🔥 Top pick'];
 view.innerHTML=`<div class="res-h"><div><h2>Your top picks for “${esc(S.need)}”</h2><div class="tags">${Object.values(S.ans).map(v=>`<span class="tg">${esc(v)}</span>`).join('')}</div></div>
 <div style="display:flex;gap:10px;align-items:center">${j.source==='live'?'<span class="live">● Live from online stores</span>':''}<button class="ghost" id="again">↻ Start over</button></div></div>
 ${j.live_note?`<div class="err">Live search unavailable, showing sample items. ${esc(j.live_note)}</div>`:''}
 <div class="grid">${j.picks.map((p,i)=>`<article class="card"><span class="badge">${labels[i]||'Pick'}</span>
 <div class="pimg">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${p.emoji||'🛍️'}'))">`:p.emoji}</div>
 <div class="body">${p.merchant?`<div class="store">${esc(p.merchant)}</div>`:''}<h3>${esc(p.name)}</h3>
 <div class="pr"><b>$${p.price.toFixed(2)}</b>${p.rating?`<span>★ ${p.rating}</span>`:''}${p.score?`<span class="match">${p.score}% match</span>`:''}</div>
 ${p.colors&&p.colors.length?`<div class="dots">${p.colors.map(c=>`<span class="dot" title="${c}" style="background:${HEX[c]||'#999'}"></span>`).join('')}${esc(p.colors.join(', '))}</div>`:''}
 <ul class="f">${(p.features||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
 <div class="why">✨ ${esc(p.why)}</div>
 <div class="qrow"><label>Qty<select class="qty" data-p="${p.price}">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></label><span class="qt">Total <b>$${p.price.toFixed(2)}</b></span></div>
 <button class="pay" data-s="${esc(p.sku)}">Buy with <b>Pay<em>Pal</em></b></button>
 ${p.url?`<a class="view" href="${esc(p.url)}" target="_blank" rel="noopener">View at store ↗</a>`:''}</div></article>`).join('')}</div><div id="cerr"></div>`;
 view.querySelectorAll('.pay').forEach(b=>b.onclick=()=>buy(b));view.querySelectorAll('.qty').forEach(s=>s.onchange=()=>{s.closest('.body').querySelector('.qt b').textContent='$'+(s.value*s.dataset.p).toFixed(2)});$('#again').onclick=intro;window.scrollTo({top:0,behavior:'smooth'})}catch(e){fail(e)}}
async function buy(b){const body=b.closest('.body'),sel=body.querySelector('.qty'),q=+(sel?sel.value:1);
 if(!ME){openAuth('Sign in to complete your purchase',()=>buy(b));return}
 if(!ME.address||!ME.address.line1){toast('Please add your shipping address first');showAccount();return}
 const name=body.querySelector('h3').textContent,price=+sel.dataset.p,total=+(price*q).toFixed(2),rem=remaining();
 if(LIMIT&&rem<=0){$('#cerr').innerHTML='<div class="err">🛡️ Budget guardian: your monthly limit of '+money(LIMIT)+' is used up. Raise it with the 💰 button.</div>';return}
 if(LIMIT&&total>rem){$('#cerr').innerHTML='<div class="err">🛡️ Budget guardian: this order ('+money(total)+') is above your remaining budget ('+money(rem)+').</div>';return}
 const a=ME.address;
 modal(`<h2>Review your order</h2><p class="hint">Check the details, then continue to PayPal.</p>
 <div class="sum"><b>${esc(name)}</b><br>Quantity: ${q} × ${money(price)}<div class="tot"><span>Total</span><b>${money(total)}</b></div></div>
 <div class="sum"><b>Ship to</b><br>${esc(ME.name)} · ${esc(ME.phone)}<br>${esc(a.line1)}, ${esc(a.city)}${a.state?', '+esc(a.state):''} ${esc(a.postal)}, ${esc(a.country)}</div>
 ${LIMIT?'<p class="fine">🛡️ Budget guardian: '+money(rem)+' left of '+money(LIMIT)+' this month.</p>':''}
 <button class="btn" id="go" style="width:100%;margin-top:12px">Continue to PayPal →</button><p class="fine" style="text-align:center;margin-top:10px">PayPal Sandbox · no real money moves</p>`);
 $('#go').onclick=()=>{closeModal();doBuy(b,q)}}
async function doBuy(b,q){const old=b.innerHTML,rem=remaining();b.disabled=true;b.textContent='Opening PayPal…';
 const caps=[S.budget,rem].filter(x=>x!=null&&x>0),cap=caps.length?Math.min(...caps):undefined;
 try{const j=await api('/api/checkout',{sku:b.dataset.s,qty:q,budget_usd:cap});if(j.error)throw new Error(j.error);if(!j.approve_url)throw new Error('No PayPal link returned');location.href=j.approve_url}
 catch(e){b.disabled=false;b.innerHTML=old;if(e.status===401){ME=null;paintAcct();openAuth('Your session expired. Please sign in again.',null);return}$('#cerr').innerHTML='<div class="err">🛡️ '+esc(e.message)+'</div>'}}
function fail(e){view.innerHTML=`<div class="wiz"><h2>Something went wrong</h2><div class="err">${esc(e.message)}</div><div class="nav2"><button class="btn" id="again">Try again</button><span></span></div></div>`;$('#again').onclick=intro}
$('#acct').onclick=()=>ME?showAccount():openAuth('',null);$('#home').onclick=intro;$('#tShop').onclick=intro;$('#tOrd').onclick=showOrders;
// chat widget
const log=$('#log'),hist=[];function add(t,c){const d=document.createElement('div');d.className='m '+(c||'');d.textContent=t;log.appendChild(d);log.scrollTop=1e9;return d}
add('Hi! 👋 I can answer questions, check an order or refund it. Try “status ORDERID”.');
$('#fab').onclick=()=>$('#chat').classList.toggle('open');
$('#cf').onsubmit=async e=>{e.preventDefault();const v=$('#cq').value.trim();if(!v)return;$('#cq').value='';add(v,'u');hist.push({role:'user',content:v});const w=add('…');
 try{const j=await api('/api/chat',{messages:hist});w.textContent=j.reply;hist.push({role:'assistant',content:j.reply})}catch(e){w.textContent='⚠️ '+e.message}};
// return from PayPal
const sp=new URLSearchParams(location.search),paid=sp.get('paid');
if(paid){$('#banner').innerHTML=`<div class="ok"><h3>🎉 Payment successful</h3><div id="rc">Your PayPal Sandbox payment was captured. Order ID: <b>${esc(paid)}</b></div><div class="row"><button class="ghost" id="st">Check status</button><button class="ghost" id="rf">Refund this order</button><button class="ghost" id="vo">View all orders →</button></div><div id="res" style="margin-top:10px;font-weight:600"></div></div>`;
 api('/api/status',{order_id:paid}).then(j=>{if(j.items){$('#rc').innerHTML+='<ul class="rcp">'+j.items.map(i=>'<li>'+i.qty+'× '+esc(i.name)+' <b>'+money(i.price*i.qty)+'</b></li>').join('')+'</ul><div>Total paid: <b>'+money(j.total)+'</b></div>'+(j.shipTo&&j.shipTo.address?'<div style="color:#065f46;margin-top:4px">📦 Shipping to '+esc(j.shipTo.name)+', '+esc(j.shipTo.address.line1)+', '+esc(j.shipTo.address.city)+'</div>':'')}}).catch(()=>{});
 $('#st').onclick=async()=>{const j=await api('/api/status',{order_id:paid});$('#res').textContent=j.error?'⚠️ '+j.error:'Status: '+j.status+' · payment '+(j.capture_status||'n/a')};
 $('#rf').onclick=async()=>{const j=await api('/api/refund',{order_id:paid});$('#res').textContent=j.error?'⚠️ '+j.error:'↩️ Refund '+j.refund_id+': '+j.status;loadOrders()};
 $('#vo').onclick=showOrders;try{history.replaceState(null,'','/')}catch(e){}}
if(sp.get('cancelled'))$('#banner').innerHTML='<div class="err">Payment was cancelled. You can pick again below.</div>';
intro();getMe().then(loadOrders);
</script></body></html>
