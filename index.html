<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayAgent · AI shopping, paid with PayPal</title>
<style>
:root{--brand:#5b4cf5;--brand2:#ec4899;--amber:#f59e0b;--ink:#111827;--mut:#6b7280;--bg:#f5f6fb;--card:#fff;--line:#e8eaf3;--ok:#059669;--grad:linear-gradient(135deg,#5b4cf5 0%,#a855f7 50%,#ec4899 100%)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0}a{color:var(--brand)}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .in{max-width:1120px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;cursor:pointer}
.logo i{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px;box-shadow:0 6px 16px rgba(91,76,245,.35)}
.pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:#eef0ff;color:var(--brand)}
.wrap{max-width:1120px;margin:auto;padding:0 24px 80px}
.hero{text-align:center;padding:64px 0 28px}
.hero .tag{display:inline-block;background:#fff;border:1px solid var(--line);padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mut);box-shadow:0 2px 8px rgba(17,24,39,.05)}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:-.03em;margin:18px auto 14px;max-width:820px;font-weight:800}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:18px;max-width:600px;margin:0 auto 30px;line-height:1.55}
.search{max-width:680px;margin:auto;display:flex;gap:8px;background:#fff;padding:8px;border-radius:20px;box-shadow:0 20px 50px rgba(91,76,245,.18);border:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;font-size:17px;padding:12px 14px;background:transparent;color:var(--ink);min-width:0}
.btn{background:var(--grad);color:#fff;font-weight:700;font-size:16px;padding:14px 26px;border-radius:14px;box-shadow:0 8px 20px rgba(91,76,245,.35);transition:.15s}.btn:hover{transform:translateY(-1px)}
.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600;padding:10px 16px;border-radius:12px;font-size:14px}.ghost:hover{border-color:var(--brand);color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.chip{background:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500;color:var(--ink);transition:.15s}.chip:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-2px)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:54px;text-align:left}
.step{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.step b{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff;font-size:18px;margin-bottom:12px}
.step:nth-child(1) b{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.step:nth-child(2) b{background:linear-gradient(135deg,#ec4899,#f97316)}.step:nth-child(3) b{background:linear-gradient(135deg,#0ea5e9,#22c55e)}
.step h4{margin:0 0 4px;font-size:16px}.step span{color:var(--mut);font-size:14px;line-height:1.5}
.bot{display:flex;gap:10px;align-items:flex-start;max-width:680px;margin:18px auto 0;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 6px 18px rgba(17,24,39,.06)}
.bot i{font-style:normal;width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.wiz{max-width:780px;margin:44px auto;background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 24px 60px rgba(17,24,39,.08)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--mut);font-weight:600}
.need{background:#eef0ff;color:var(--brand);padding:5px 12px;border-radius:99px;font-weight:600;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:8px;background:#eef0f6;border-radius:99px;overflow:hidden;margin-bottom:28px}.prog i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.wiz h2{font-size:clamp(24px,4vw,32px);margin:0 0 6px;letter-spacing:-.02em}.wiz .hint{color:var(--mut);margin:0 0 22px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:#fafbff;border:2px solid var(--line);border-radius:16px;padding:16px;font-size:16px;font-weight:600;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--brand);background:#f3f2ff;transform:translateY(-2px);box-shadow:0 10px 24px rgba(91,76,245,.15)}
.opt .k{flex:none;width:36px;height:36px;border-radius:11px;background:#eef0ff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:15px}
.opt .sw{flex:none;width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.opt:hover .k{background:var(--brand);color:#fff}
.nav2{margin-top:22px;display:flex;justify-content:space-between}
.load{text-align:center;padding:70px 20px}.spin{width:46px;height:46px;border:5px solid #e6e8f5;border-top-color:var(--brand);border-radius:50%;margin:0 auto 18px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.res-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin:40px 0 20px}
.res-h h2{margin:0;font-size:clamp(26px,4vw,36px);letter-spacing:-.02em}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.tg{background:#fff;border:1px solid var(--line);padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mut)}
.live{display:inline-flex;gap:6px;align-items:center;background:#ecfdf5;color:var(--ok);font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:.2s;box-shadow:0 4px 16px rgba(17,24,39,.04)}
.card:hover{transform:translateY(-5px);box-shadow:0 24px 50px rgba(91,76,245,.16);border-color:#d9d6ff}
.badge{position:absolute;top:14px;left:14px;z-index:2;color:#fff;font-weight:700;font-size:12px;padding:6px 12px;border-radius:99px;background:var(--grad);box-shadow:0 6px 14px rgba(91,76,245,.35)}
.card:nth-child(2) .badge{background:linear-gradient(135deg,#f97316,#f59e0b)}.card:nth-child(3) .badge{background:linear-gradient(135deg,#0ea5e9,#22c55e)}
.pimg{height:240px;background:#fff;display:flex;align-items:center;justify-content:center;padding:18px;border-bottom:1px solid var(--line);font-size:80px;background-image:radial-gradient(circle at 50% 120%,#f1efff,transparent 70%)}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.body{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1}
.store{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.body h3{margin:0;font-size:18px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:10px}.pr b{font-size:30px;letter-spacing:-.02em}.pr span{color:var(--amber);font-weight:700;font-size:14px}
.f{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.f li{display:flex;gap:8px;font-size:14px;color:#374151;line-height:1.45}.f li:before{content:"✓";color:var(--ok);font-weight:800}
.f li{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why{background:linear-gradient(135deg,#f5f3ff,#fdf2f8);border:1px solid #ece8ff;color:#4c1d95;padding:11px 13px;border-radius:14px;font-size:14px;line-height:1.45}
.dots{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}.dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pay{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;background:#ffc439;color:#111;font-weight:700;font-size:16px;padding:15px;border-radius:14px;transition:.15s;width:100%}
.pay:hover{background:#f7b928;box-shadow:0 8px 18px rgba(255,196,57,.5)}.pay b{color:#003087;font-style:italic;font-weight:800}.pay b em{color:#009cde;font-style:italic}
.view{text-align:center;font-size:13px;font-weight:600;text-decoration:none}
.trust{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;margin:42px 0 0;color:var(--mut);font-size:14px;font-weight:600}
.ok{background:linear-gradient(135deg,#ecfdf5,#f0fdf4);border:1px solid #a7f3d0;border-radius:20px;padding:20px 22px;margin-top:24px}
.ok h3{margin:0 0 4px;color:#065f46}.ok .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px 14px;border-radius:14px;margin-top:14px;font-size:14px;word-break:break-word}
.sk{height:480px;border-radius:24px;background:linear-gradient(90deg,#eceefa 25%,#f6f7fd 37%,#eceefa 63%);background-size:400% 100%;animation:sh 1.3s infinite}@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 0 10px}
.fab{position:fixed;right:22px;bottom:22px;z-index:30;width:60px;height:60px;border-radius:50%;background:var(--grad);color:#fff;font-size:26px;box-shadow:0 14px 30px rgba(91,76,245,.45)}
.chat{position:fixed;right:22px;bottom:96px;z-index:30;width:360px;max-width:calc(100vw - 44px);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 70px rgba(17,24,39,.22);display:none;flex-direction:column;overflow:hidden}
.chat.open{display:flex}.ch{background:var(--grad);color:#fff;padding:14px 18px;font-weight:700}
#log{height:280px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fafbff}
.m{padding:9px 13px;border-radius:14px;max-width:85%;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line)}.m.u{align-self:flex-end;background:var(--brand);color:#fff;border-color:var(--brand)}
.cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.cf input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;outline:0;min-width:0}.cf button{background:var(--brand);color:#fff;border-radius:12px;padding:0 16px;font-weight:700}
@media(max-width:600px){.wiz{padding:22px}.search{flex-direction:column}.hero{padding-top:40px}}
</style></head><body>
<div class="nav"><div class="in"><div class="logo" id="home"><i>✦</i>PayAgent</div><span class="pill" id="mode">PayPal Sandbox</span></div></div>
<div class="wrap"><div id="banner"></div><div id="view"></div>
<div class="trust"><span>🔒 Secure PayPal checkout</span><span>🌐 Live products from online stores</span><span>🛡️ AI budget guardrail</span><span>↩️ One-click refunds</span></div>
<footer>PayAgent · built for the PayPal AI Hackathon · payments run in the PayPal Sandbox (demo, no real money)</footer></div>
<button class="fab" id="fab" aria-label="Chat">💬</button>
<div class="chat" id="chat"><div class="ch">PayAgent assistant</div><div id="log"></div><form class="cf" id="cf"><input id="cq" placeholder="Ask anything, or: refund ORDERID" autocomplete="off"><button>Send</button></form></div>
<script>
const $=s=>document.querySelector(s),view=$('#view');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEX={Black:'#111827',White:'#f3f4f6',Grey:'#9ca3af',Gray:'#9ca3af',Navy:'#1e3a8a',Silver:'#cbd5e1',Blue:'#2563eb',Red:'#dc2626',Green:'#16a34a',Pink:'#ec4899',Any:'conic-gradient(#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7,#ef4444)',Multi:'conic-gradient(#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7,#ef4444)'};
const S={need:'',qs:[],i:0,ans:{},botMsg:''};
async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const j=await r.json();if(j.error&&r.status>=400)throw new Error(j.error);return j}
function intro(){S.need='';S.qs=[];S.i=0;S.ans={};
 view.innerHTML=`<section class="hero"><span class="tag">✨ AI shopping agent · powered by PayPal</span>
 <h1>Tell us what you need. <span>We’ll find the best one.</span></h1>
 <p>Answer a few quick questions and PayAgent searches online stores, picks the best matches for you, and lets you pay securely with PayPal.</p>
 <form class="search" id="nf"><input id="need" placeholder="What do you want to buy? e.g. a black pen, running shoes, a gift for a coder" autocomplete="off" autofocus><button class="btn">Find my best match →</button></form>
 ${S.botMsg?`<div class="bot"><i>✦</i><div>${esc(S.botMsg)}</div></div>`:''}
 <div class="chips">${['🖊️ A good pen','🎧 Wireless headphones','👟 Running shoes','🎒 Laptop backpack','🎁 Gift for a coder'].map(t=>`<button type="button" class="chip" data-t="${t.slice(3)}">${t}</button>`).join('')}</div>
 <div class="steps"><div class="step"><b>1</b><h4>Tell us what you want</h4><span>Type it in your own words, no filters or menus.</span></div>
 <div class="step"><b>2</b><h4>Answer quick questions</h4><span>Budget, colour and what matters most, as simple choices.</span></div>
 <div class="step"><b>3</b><h4>Pay with PayPal</h4><span>Get the top 3 live matches and check out in one click.</span></div></div></section>`;
 $('#nf').onsubmit=e=>{e.preventDefault();const v=$('#need').value.trim();if(v)begin(v)};
 view.querySelectorAll('.chip').forEach(b=>b.onclick=()=>begin(b.dataset.t))}
function loading(t,sub){view.innerHTML=`<div class="wiz load"><div class="spin"></div><h2>${t}</h2><p class="hint">${sub||'PayAgent is working on it…'}</p></div>`}
async function begin(need){S.need=need;S.botMsg='';loading('Getting your questions ready…');
 try{const j=await api('/api/questions',{need});
  if(j.chat){S.botMsg=j.reply;intro();return}
  S.qs=j.questions;S.i=0;S.ans={};$('#mode').textContent=(j.ai?'AI active':'Demo mode')+' · PayPal Sandbox';ask()}catch(e){fail(e)}}
function ask(){const q=S.qs[S.i],isC=q.id==='colour',n=S.qs.length;
 view.innerHTML=`<div class="wiz"><div class="top"><span>Step ${S.i+1} of ${n}</span><span class="need">🔎 ${esc(S.need)}</span></div>
 <div class="prog"><i style="width:${((S.i+1)/n)*100}%"></i></div><h2>${esc(q.q)}</h2><p class="hint">Pick one option. This helps us choose better for you.</p>
 <div class="opts">${q.options.map((o,k)=>`<button class="opt" data-o="${esc(o)}">${isC?`<span class="sw" style="background:${HEX[o]||'#d1d5db'}"></span>`:`<span class="k">${'ABCDEFGH'[k]}</span>`}<span>${esc(o)}</span></button>`).join('')}</div>
 <div class="nav2">${S.i?'<button class="ghost" id="back">← Back</button>':'<button class="ghost" id="back">← Change request</button>'}<span></span></div></div>`;
 view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.ans[q.id]=b.dataset.o;S.i++;S.i<n?ask():results()});
 $('#back').onclick=()=>{if(S.i){S.i--;ask()}else intro()};window.scrollTo({top:0,behavior:'smooth'})}
async function results(){
 view.innerHTML=`<div class="res-h"><div><h2>Finding your best matches…</h2><p class="hint" style="color:var(--mut)">Searching online stores and ranking with AI</p></div></div><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`;
 try{const j=await api('/api/recommend',{need:S.need,answers:S.ans});S.budget=j.budget_max;const labels=['🏆 Best match','⭐ Great value','🔥 Top pick'];
 view.innerHTML=`<div class="res-h"><div><h2>Your top picks for “${esc(S.need)}”</h2><div class="tags">${Object.values(S.ans).map(v=>`<span class="tg">${esc(v)}</span>`).join('')}</div></div>
 <div style="display:flex;gap:10px;align-items:center">${j.source==='live'?'<span class="live">● Live from online stores</span>':''}<button class="ghost" id="again">↻ Start over</button></div></div>
 ${j.live_note?`<div class="err">Live search unavailable, showing sample items. ${esc(j.live_note)}</div>`:''}
 <div class="grid">${j.picks.map((p,i)=>`<article class="card"><span class="badge">${labels[i]||'Pick'}</span>
 <div class="pimg">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${p.emoji||'🛍️'}'))">`:p.emoji}</div>
 <div class="body">${p.merchant?`<div class="store">${esc(p.merchant)}</div>`:''}<h3>${esc(p.name)}</h3>
 <div class="pr"><b>$${p.price.toFixed(2)}</b>${p.rating?`<span>★ ${p.rating}</span>`:''}</div>
 ${p.colors&&p.colors.length?`<div class="dots">${p.colors.map(c=>`<span class="dot" title="${c}" style="background:${HEX[c]||'#999'}"></span>`).join('')}${esc(p.colors.join(', '))}</div>`:''}
 <ul class="f">${(p.features||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
 <div class="why">✨ ${esc(p.why)}</div>
 <button class="pay" data-s="${esc(p.sku)}">Buy with <b>Pay<em>Pal</em></b></button>
 ${p.url?`<a class="view" href="${esc(p.url)}" target="_blank" rel="noopener">View at store ↗</a>`:''}</div></article>`).join('')}</div><div id="cerr"></div>`;
 view.querySelectorAll('.pay').forEach(b=>b.onclick=()=>buy(b));$('#again').onclick=intro;window.scrollTo({top:0,behavior:'smooth'})}catch(e){fail(e)}}
async function buy(b){const old=b.innerHTML;b.disabled=true;b.textContent='Opening PayPal…';
 try{const j=await api('/api/checkout',{sku:b.dataset.s,qty:1,budget_usd:S.budget});if(j.error)throw new Error(j.error);if(!j.approve_url)throw new Error('No PayPal link returned');location.href=j.approve_url}
 catch(e){b.disabled=false;b.innerHTML=old;$('#cerr').innerHTML=`<div class="err">⚠️ ${esc(e.message)}</div>`}}
function fail(e){view.innerHTML=`<div class="wiz"><h2>Something went wrong</h2><div class="err">${esc(e.message)}</div><div class="nav2"><button class="btn" id="again">Try again</button><span></span></div></div>`;$('#again').onclick=intro}
$('#home').onclick=intro;
// chat widget
const log=$('#log'),hist=[];function add(t,c){const d=document.createElement('div');d.className='m '+(c||'');d.textContent=t;log.appendChild(d);log.scrollTop=1e9;return d}
add('Hi! 👋 I can answer questions, check an order or refund it. Try “status ORDERID”.');
$('#fab').onclick=()=>$('#chat').classList.toggle('open');
$('#cf').onsubmit=async e=>{e.preventDefault();const v=$('#cq').value.trim();if(!v)return;$('#cq').value='';add(v,'u');hist.push({role:'user',content:v});const w=add('…');
 try{const j=await api('/api/chat',{messages:hist});w.textContent=j.reply;hist.push({role:'assistant',content:j.reply})}catch(e){w.textContent='⚠️ '+e.message}};
// return from PayPal
const sp=new URLSearchParams(location.search),paid=sp.get('paid');
if(paid){$('#banner').innerHTML=`<div class="ok"><h3>🎉 Payment successful</h3><div>Your PayPal Sandbox payment was captured. Order ID: <b>${esc(paid)}</b></div><div class="row"><button class="ghost" id="st">Check status</button><button class="ghost" id="rf">Refund this order</button></div><div id="res" style="margin-top:10px;font-weight:600"></div></div>`;
 $('#st').onclick=async()=>{const j=await api('/api/status',{order_id:paid});$('#res').textContent=j.error?'⚠️ '+j.error:`Status: ${j.status} · payment ${j.capture_status||'n/a'}`};
 $('#rf').onclick=async()=>{const j=await api('/api/refund',{order_id:paid});$('#res').textContent=j.error?'⚠️ '+j.error:`↩️ Refund ${j.refund_id}: ${j.status}`}}
if(sp.get('cancelled'))$('#banner').innerHTML='<div class="err">Payment was cancelled. You can pick again below.</div>';
intro();
</script></body></html>
